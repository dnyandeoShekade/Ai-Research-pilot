<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090B" />
    <title>Offline - ResearchPilot AI</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f7f7fc;
        color: #0f172a;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 28rem);
        padding: 2rem;
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        background: white;
        text-align: center;
        box-shadow: 0 20px 60px -32px rgb(49 46 129 / 30%);
      }

      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        margin-top: 1rem;
        padding: 0 1rem;
        border-radius: 0.75rem;
        background: #7c3aed;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to continue researching with ResearchPilot AI.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
